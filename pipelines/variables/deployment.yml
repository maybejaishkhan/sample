# ------------------------------------------------------------------------------
# Deployment + DAST variables.
#
# All machine-specific settings for the Windows deployment VM live here so no
# templates or jobs contain hardcoded paths/URLs. Every value in this file is
# expected to be overridden per-environment (e.g. via a variable group or a
# per-branch variable template).
# ------------------------------------------------------------------------------

variables:
  # ------------------------------------------------------------- Deployment
  # Self-hosted agent pool the Deploy and DAST jobs run on. The agent must
  # have ZAP installed for DAST (see ZapPath) and the application deployed by
  # this stage. No Azure DevOps Environment/resource is required - Deploy and
  # DAST are regular pool jobs, not deployment jobs.
  - name: VmPool
    value: cloud-poc

  # Physical path on the VM where the application is deployed.
  - name: SitePath
    value: C:\site

  # Public URL used to verify the application is reachable after deployment and
  # as the DAST scan target. On the VM itself the app is reached via localhost.
  # Must match the port the app binds to (see the app's appsettings.json).
  - name: ApplicationUrl
    value: http://localhost:5000

  # Windows service that hosts the application. The Deploy job stops/starts it
  # around the file copy. The app MUST be registered as a service on the VM
  # (e.g. via NSSM): a plain Start-Process from the Deploy job is killed when
  # the job ends (the agent terminates its per-job process tree), so the app
  # would not survive until the DAST stage.
  - name: WindowsServiceName
    value: WebSample

  # Optional command used to start a self-hosted application (e.g.
  # 'dotnet WebSample.dll'). Empty = the app is started via the Windows service
  # setting above.
  - name: StartCommand
    value: ''

  # Seconds to keep polling ApplicationUrl before failing the Deploy job.
  - name: WaitTimeoutSeconds
    value: '300'

  # Seconds between reachability probes.
  - name: ProbeIntervalSeconds
    value: '5'

  # -------------------------------------------------------------------- DAST
  # Fully qualified path to the pre-installed OWASP ZAP executable on the VM.
  # ZAP is intentionally NOT installed/downloaded by this pipeline.
  - name: ZapPath
    value: C:\Program Files\ZAP\Zed Attack Proxy\zap.bat

  # DAST scan target. Must come from a variable (never hardcoded).
  - name: ZapTarget
    value: $(ApplicationUrl)

  # Overall timeout (seconds) for the ZAP scan, including spider + active scan.
  - name: ZapTimeout
    value: '600'

  # ZAP daemon port used for the ZAP REST API.
  - name: ZapApiPort
    value: '8090'

  # ------------------------------------------------------- Report publishing
  # Set to false to skip HTML dashboard generation/publishing entirely. Only
  # the per-scanner artifacts (trufflehog, semgrep, msdo, zap) are always
  # published by the scanner jobs themselves.
  - name: PublishReports
    value: true
