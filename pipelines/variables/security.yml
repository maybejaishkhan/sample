# ------------------------------------------------------------------------------
# Security pipeline variables (SAST scanners).
#
# Every configurable value for the static analysis scanners lives here so the
# scanner jobs stay free of magic strings. To add a new scanner later, create
# one job template + one parser module and add its settings to this file.
# ------------------------------------------------------------------------------

variables:
  # ---------------------------------------------------------------- Semgrep
  # Semgrep ruleset to run. Either a built-in ruleset ('p/...') or a path to a
  # rules file checked into the repository (see SemgrepConfigFile).
  - name: SemgrepRules
    value: p/security-audit

  # Optional path to a Semgrep rules file. Leave empty to rely on SemgrepRules.
  - name: SemgrepConfigFile
    value: ''

  # Semgrep version to install. Empty -> latest from PyPI.
  - name: SemgrepVersion
    value: ''

  # ------------------------------------------------------------- TruffleHog
  # Extra arguments passed to `trufflehog filesystem`. Empty by default.
  - name: TrufflehogExtraArgs
    value: '--no-update'

  # TruffleHog version to install (used to build the GitHub release URL).
  # TODO: bump to a recent release before production use.
  - name: TrufflehogVersion
    value: 3.63.10

  # Architecture part of the TruffleHog release asset file name. Only change
  # this if the agent is not an x64 Linux machine.
  - name: TrufflehogArch
    value: linux_amd64

  # Git history depth scanned by TruffleHog ('' = full history).
  - name: TrufflehogDepth
    value: ''

  # ----------------------------------------------------------- DefectDojo
  # Optional stage that uploads the scanner reports to a DefectDojo instance
  # at the end of the pipeline. Set to 'true' to enable it.
  - name: EnableDefectDojo
    value: true

  # Agent pool for the DefectDojo job (a literal pool name, not a macro - Azure
  # does not re-expand nested variables). Use 'ubuntu-latest' for a hosted agent
  # or the name of a self-hosted pool that can reach DefectDojoUrl.
  - name: DefectDojoPool
    value: cloud-poc

  # Name of the specific agent in DefectDojoPool to run the import on. Leave
  # empty to let Azure pick any agent in the pool. When set, the job adds a
  # `Agent.Name -equals` demand. NOTE: set this value in this file (a compile
  # time variable), not in a runtime variable group, or the demand is not added.
  - name: DefectDojoAgentName
    value: defect-dojo

  # Base URL of the DefectDojo instance, e.g. http://<server>:<port>.
  # Override per environment; never hardcode in a shared variable file.
  - name: DefectDojoUrl
    value: 'http://defect-dojo.eastus2.cloudapp.azure.com'

  # Product / product type / engagement to import into. DefectDojo
  # auto-creates them when they do not exist yet.
  - name: DefectDojoProductName
    value: pipeline-demo
  - name: DefectDojoProductTypeName
    value: 'demo-project'
  - name: DefectDojoEngagementName
    value: CI-CD

  # Import mode:
  #   import    - import-scan: creates a fresh Test per pipeline run.
  #   reimport  - reimport-scan: updates a single Test per scan type inside
  #               the engagement, closing findings that no longer appear.
  - name: DefectDojoImportMode
    value: reimport

  # ---------------------------------------------------------- Policy gates
  # If a scanner finds findings at these severities the job FAILS and later
  # stages (Deploy/DAST) are skipped. The DefectDojo stage still runs via
  # `succeededOrFailed()` so reports are never lost.
  #
  # TruffleHog findings are always mapped to high (verified or not), so with
  # FailOnHigh=true even unverified secrets fail the build - TruffleHog's own
  # --fail only exits non-zero for verified results.
  - name: FailOnCritical
    value: true
  - name: FailOnHigh
    value: true

  # Scanner report file names. These must match the files produced by the
  # run-* step templates and consumed by the Python parsers.
  - name: SemgrepJsonReport
    value: semgrep.json
  - name: SemgrepSarifReport
    value: semgrep.sarif
  - name: TrufflehogJsonReport
    value: trufflehog.json
  - name: ZapJsonReport
    value: zap.json
  - name: ZapXmlReport
    value: zap.xml
  - name: ZapHtmlReport
    value: zap.html

  # Names of the pipeline artifacts published by each scanner job. The DefectDojo
  # stage downloads these by name, so keep them in sync if renamed.
  - name: TrufflehogArtifact
    value: trufflehog
  - name: SemgrepArtifact
    value: semgrep
  - name: ZapArtifact
    value: zap
