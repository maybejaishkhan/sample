# ------------------------------------------------------------------------------
# Global pipeline variables.
#
# These apply to every stage/job/step in the pipeline. Values that are specific
# to a single concern (build, security, deployment) live in their own file:
#
#   build.yml       - build/artifact settings
#   security.yml    - SAST scanner + DefectDojo settings
#   deployment.yml  - VM deployment + DAST settings
#
# Only put settings here that are genuinely cross-cutting.
# ------------------------------------------------------------------------------

variables:
  # Hosted image used by all agent-based jobs that can run on Linux.
  - name: AgentImage
    value: ubuntu-latest

  # Python version used by the report aggregation scripts.
  - name: PythonVersion
    value: '3.11'

  # Fully qualified location of the report folder (used by scripts/tasks).
  # Reports are written to the agent's artifact staging area - NOT into the
  # repository - and published as pipeline artifacts by the scanner jobs.
  - name: RawReportsDirFull
    value: $(Build.ArtifactStagingDirectory)/reports/raw

  # Where the Python scripts live (relative to the repo root).
  - name: ScriptsDir
    value: pipelines/scripts
