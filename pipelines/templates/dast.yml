# ==============================================================================
# DAST stage.
#
# Runs an OWASP ZAP automated scan against the deployed application. ZAP is
# already installed on the Windows VM and is never downloaded/installed by this
# pipeline. This stage only runs after the Deploy stage has succeeded, because
# there is nothing to scan otherwise.
#
#   zap -> reports/raw/zap.json + zap.xml + zap.html
#
# The scan target URL comes from the ZapTarget variable.
# ==============================================================================

stages:
  - stage: DAST
    displayName: DAST
    dependsOn: Deploy
    jobs:
      - job: ZAP
        displayName: OWASP ZAP scan
        pool: $(VmPool)
        steps:
          - checkout: self
  
          - powershell: |
              New-Item -ItemType Directory -Force -Path "$(RawReportsDirFull)" | Out-Null
            displayName: Ensure reports directory
            condition: succeededOrFailed()
  
          - task: PowerShell@2
            displayName: Run ZAP scan against $(ZapTarget)
            continueOnError: true
            inputs:
              filePath: $(System.DefaultWorkingDirectory)/$(ScriptsDir)/zap_scan.ps1
              arguments: >-
                -TargetUrl "$(ZapTarget)"
                -OutputDirectory "$(RawReportsDirFull)"
                -ZapPath "$(ZapPath)"
                -ApiPort $(ZapApiPort)
                -TimeoutSeconds $(ZapTimeout)
                -JsonReportName "$(ZapJsonReport)"
                -XmlReportName "$(ZapXmlReport)"
                -HtmlReportName "$(ZapHtmlReport)"
  
          # Archive (always, so output is never lost) --------------------
          # continueOnError: re-running a stage tries to publish the same
          # artifact name again, which Azure rejects ("already exists").
          - task: PublishPipelineArtifact@1
            displayName: Archive results ($(ZapArtifact))
            continueOnError: true

            condition: always()
            inputs:
              targetPath: $(RawReportsDirFull)
              artifactName: $(ZapArtifact)
              publishLocation: pipeline
  
          # Policy gate --------------------------------------------------
          # Requires Python to be visible to the agent. If the agent runs as
          # Local System (e.g. so it can control the app service), a per-user
          # Python install is not on its PATH - install machine-wide or add it
          # to the system PATH. Alternative: move this gate to a hosted job
          # that downloads the zap artifact.
          - powershell: |
              python "$(ScriptsDir)/policy_check.py" --file "$(RawReportsDirFull)/$(ZapJsonReport)"
            displayName: Policy gate (ZAP)
            condition: always()
            env:
              FAIL_ON_CRITICAL: $(FailOnCritical)
              FAIL_ON_HIGH: $(FailOnHigh)
