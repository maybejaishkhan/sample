# ==============================================================================
# MSDO stage.
#
# Runs Microsoft Security DevOps (a collection of Microsoft security tools) on
# the repository and emits a consolidated SARIF file. MSDO only runs on
# Windows, so this stage pins the Windows hosted image.
#
#   msdo -> reports/raw/msdo.sarif
#
# PREREQUISITE: install the 'Microsoft Security DevOps' extension in the Azure
# DevOps organization (Marketplace -> Manage extensions), otherwise the
# MicrosoftSecurityDevOps@1 task below cannot be resolved.
# ==============================================================================

stages:
  - stage: MSDO
    displayName: MSDO
    dependsOn: SAST
    pool:
      vmImage: $(WindowsAgentImage)
    jobs:
      - job: MSDO
        displayName: Microsoft Security DevOps
        steps:
          - checkout: self

          # Scan ---------------------------------------------------------------
          # The MSDO task publishes its SARIF to a pipeline artifact named
          # 'CodeAnalysisLogs' (see artifactName below); it does NOT write into
          # the reports directory. The step after the scan downloads that
          # artifact and consolidates it to the canonical name.
          - task: MicrosoftSecurityDevOps@1
            displayName: Run MSDO scan
            continueOnError: true
            inputs:
              command: run
              policy: $(MsdoPolicy)
              config: ''
              tools: $(MsdoTools)
              publish: true
              artifactName: CodeAnalysisLogs

          # Download the SARIF artifact back into the workspace. Best-effort:
          # if the scan produced nothing, the artifact does not exist and this
          # step fails silently.
          - task: DownloadPipelineArtifact@2
            displayName: Download MSDO SARIF (CodeAnalysisLogs)
            continueOnError: true
            inputs:
              buildType: current
              artifactName: CodeAnalysisLogs
              targetPath: $(Pipeline.Workspace)/msdo

          # The exact SARIF file name/layout inside the artifact can vary, so
          # consolidate the first *.sarif to the canonical name.
          - powershell: |
              $ErrorActionPreference = 'SilentlyContinue'
              New-Item -ItemType Directory -Force -Path "$(RawReportsDirFull)" | Out-Null
              $sarif = Get-ChildItem -Path "$(Pipeline.Workspace)/msdo" -Filter *.sarif -Recurse |
                Select-Object -First 1
              if ($sarif) {
                Copy-Item $sarif.FullName "$(RawReportsDirFull)/$(MsdoSarifReport)" -Force
                Write-Host "Consolidated MSDO SARIF to $(MsdoSarifReport)"
              } else {
                Write-Host "##vso[task.logissue type=warning]MSDO produced no SARIF output."
              }
            displayName: Consolidate MSDO SARIF
            condition: succeededOrFailed()

          # Archive (always, so output is never lost) --------------------------
          # continueOnError: re-running a stage would re-publish the same
          # artifact name, which Azure rejects ("already exists").
          - task: PublishPipelineArtifact@1
            displayName: Archive results ($(MsdoArtifact))
            condition: always()
            continueOnError: true
            inputs:
              targetPath: $(RawReportsDirFull)
              artifactName: $(MsdoArtifact)
              publishLocation: pipeline

          # Policy gate --------------------------------------------------------
          - powershell: |
              python "$(ScriptsDir)/policy_check.py" --file "$(RawReportsDirFull)/$(MsdoSarifReport)"
            displayName: Policy gate (MSDO)
            condition: always()
            env:
              FAIL_ON_CRITICAL: $(FailOnCritical)
              FAIL_ON_HIGH: $(FailOnHigh)
