# ==============================================================================
# DefectDojo stage (optional).
#
# Uploads the aggregated scanner reports to a DefectDojo instance via its REST
# API. Enabled with the `EnableDefectDojo` variable; when disabled the stage is
# skipped entirely and the pipeline is unchanged.
#
# The stage depends on Publish and downloads each scanner's own artifact
# (published by the SAST/MSDO/DAST jobs), so it imports exactly the same raw
# reports that the HTML dashboard is built from:
#
#   trufflehog.json -> Trufflehog Scan
#   semgrep.json    -> Semgrep JSON Report
#   msdo.sarif      -> SARIF
#   zap.xml         -> ZAP Scan
#
# PREREQUISITES:
#   * A DefectDojo API v2 token (user menu -> API v2 Token).
#   * The agent pool used here must be able to reach the DefectDojo URL. If the
#     instance is not publicly reachable, point `DefectDojoPool` at a
#     self-hosted agent on a network that can reach it.
#   * Provide the token via a secret (variable group / library secret) and
#     override `DefectDojoUrl` per environment - never commit real values.
#
# Product / engagement / product type are auto-created by DefectDojo when they
# do not exist yet (see the import script for the API call shape).
# ==============================================================================

stages:
  - stage: DefectDojo
    displayName: DefectDojo
    dependsOn: Publish
    condition: eq(variables['EnableDefectDojo'], 'true')
    pool: $(DefectDojoPool)
    jobs:
      - job: ImportScanResults
        displayName: Import scan results into DefectDojo
        # When DefectDojoAgentName is set, pin the job to that specific agent
        # in the pool (e.g. a dedicated 'defect-dojo' agent that can reach the
        # server). The key is only inserted when the variable is non-empty, so
        # hosted pools are unaffected.
        ${{ if ne(variables['DefectDojoAgentName'], '') }}:
          demands:
            - Agent.Name -equals $(DefectDojoAgentName)
        steps:
          - checkout: self

          # Raw reports published by the SAST/MSDO/DAST jobs. Each download is
          # best-effort: a scanner that produced nothing simply contributes
          # nothing to the import.
          - task: DownloadPipelineArtifact@2
            displayName: Download TruffleHog output
            continueOnError: true
            inputs:
              buildType: current
              artifactName: $(TrufflehogArtifact)
              targetPath: $(RawReportsDirFull)

          - task: DownloadPipelineArtifact@2
            displayName: Download Semgrep output
            continueOnError: true
            inputs:
              buildType: current
              artifactName: $(SemgrepArtifact)
              targetPath: $(RawReportsDirFull)

          - task: DownloadPipelineArtifact@2
            displayName: Download MSDO output
            continueOnError: true
            inputs:
              buildType: current
              artifactName: $(MsdoArtifact)
              targetPath: $(RawReportsDirFull)

          - task: DownloadPipelineArtifact@2
            displayName: Download ZAP output
            continueOnError: true
            inputs:
              buildType: current
              artifactName: $(ZapArtifact)
              targetPath: $(RawReportsDirFull)

          # Import each scanner's report. PowerShell runs on both the hosted
          # Linux image and self-hosted Windows agents (the script uses curl).
          # The report file -> scan type mapping is passed via an env var
          # (DEFECTDOJO_SCAN_TYPES) rather than a CLI argument because the
          # PowerShell task mangles argument values that contain '='.
          - task: PowerShell@2
            displayName: Import scan results
            inputs:
              filePath: $(System.DefaultWorkingDirectory)/pipelines/scripts/import_defectdojo.ps1
              arguments: >-
                -RawDir "$(RawReportsDirFull)"
                -Mode "$(DefectDojoImportMode)"
                -Product "$(DefectDojoProductName)"
                -ProductType "$(DefectDojoProductTypeName)"
                -Engagement "$(DefectDojoEngagementName)"
            env:
              DEFECTDOJO_URL: $(DefectDojoUrl)
              DEFECTDOJO_API_TOKEN: $(DefectDojoApiToken)
              DEFECTDOJO_SCM_URI: $(Build.Repository.Uri)
              DEFECTDOJO_SCM_BRANCH: $(Build.SourceBranchName)
              DEFECTDOJO_SCAN_TYPES: "$(TrufflehogJsonReport)=Trufflehog Scan,$(SemgrepJsonReport)=Semgrep JSON Report,$(MsdoSarifReport)=SARIF,$(ZapXmlReport)=ZAP Scan"
