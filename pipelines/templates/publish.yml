# ==============================================================================
# Publish stage.
#
# Aggregates every scanner's raw output into a common model, generates the
# single-page HTML dashboard and publishes it as the `reports-html` artifact.
#
# IMPORTANT: this stage uses `condition: always()` so it runs even when an
# earlier stage (SAST/MSDO/Deploy/DAST) fails or is skipped. Reports are never
# lost because of a failing scanner.
# ==============================================================================

stages:
  - stage: Publish
    displayName: Publish reports
    dependsOn: [SAST, MSDO, DAST]
    condition: always()
    pool:
      vmImage: $(AgentImage)
    jobs:
      - job: PublishReports
        displayName: Aggregate and publish reports
        steps:
          - checkout: self

          - script: mkdir -p "$(RawReportsDirFull)" "$(HtmlReportsDirFull)" "$(SummaryReportsDirFull)"
            displayName: Ensure reports directories
            condition: succeededOrFailed()

          # --- Download raw scanner output ------------------------------------
          # Each download is best-effort: a missing artifact simply means that
          # scanner did not produce output (or never ran).
          - task: DownloadPipelineArtifact@2
            displayName: Download TruffleHog output
            continueOnError: true
            inputs:
              buildType: current
              artifactName: $(TrufflehogArtifact)
              targetPath: $(RawReportsDirFull)

          - task: DownloadPipelineArtifact@2
            displayName: Download Semgrep output
            continueOnError: true
            inputs:
              buildType: current
              artifactName: $(SemgrepArtifact)
              targetPath: $(RawReportsDirFull)

          - task: DownloadPipelineArtifact@2
            displayName: Download MSDO output
            continueOnError: true
            inputs:
              buildType: current
              artifactName: $(MsdoArtifact)
              targetPath: $(RawReportsDirFull)

          - task: DownloadPipelineArtifact@2
            displayName: Download ZAP output
            continueOnError: true
            inputs:
              buildType: current
              artifactName: $(ZapArtifact)
              targetPath: $(RawReportsDirFull)

          # --- Aggregate ------------------------------------------------------
          - script: |
              python3 "$(ScriptsDir)/aggregate.py" \
                --raw "$(RawReportsDirFull)" \
                --output "$(SummaryReportsDirFull)/$(CombinedReportFile)"
            displayName: Aggregate scanner findings
            condition: succeededOrFailed()

          - script: |
              python3 "$(ScriptsDir)/generate_html.py" \
                --combined "$(SummaryReportsDirFull)/$(CombinedReportFile)" \
                --output "$(HtmlReportsDirFull)/$(HtmlReportFile)"
            displayName: Generate HTML dashboard
            condition: and(succeededOrFailed(), eq(variables['PublishReports'], 'true'))

          # --- Publish --------------------------------------------------------
          - task: PublishPipelineArtifact@1
            displayName: Publish artifact ($(ReportsHtmlArtifact))
            condition: eq(variables['PublishReports'], 'true')
            inputs:
              targetPath: $(HtmlReportsDirFull)
              artifactName: $(ReportsHtmlArtifact)
              publishLocation: pipeline
