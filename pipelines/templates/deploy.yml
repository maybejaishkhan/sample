# ==============================================================================
# Deploy stage.
#
# Deploys the artifact produced by the Build stage onto the Windows VM. Runs as
# a regular job on the self-hosted agent pool (see VmPool in
# pipelines/variables/deployment.yml), so the tasks execute directly on the VM.
#
#   1. Download the artifact from the Build stage
#   2. Run scripts/deploy.ps1 which:
#        - stops the app (Windows service, when configured)
stages:
  - stage: Deploy
    displayName: Deploy to Windows VM
    dependsOn: MSDO
    jobs:
      - job: Deploy
        displayName: Deploy to Windows VM
        pool: $(VmPool)
        steps:
          - checkout: self

          - task: DownloadPipelineArtifact@2
            displayName: Download artifact ($(ArtifactName))
            inputs:
              buildType: current
              artifactName: $(ArtifactName)
              targetPath: $(Pipeline.Workspace)/drop

          - task: PowerShell@2
            displayName: Deploy to $(SitePath)
            inputs:
              filePath: $(System.DefaultWorkingDirectory)/pipelines/scripts/deploy.ps1
              arguments: >-
                -SitePath "$(SitePath)"
                -SourcePath "$(Pipeline.Workspace)/drop"
                -WindowsServiceName "$(WindowsServiceName)"
                -ApplicationUrl "$(ApplicationUrl)"

                -StartCommand "$(StartCommand)"
                -WaitTimeoutSeconds $(WaitTimeoutSeconds)
                -ProbeIntervalSeconds $(ProbeIntervalSeconds)